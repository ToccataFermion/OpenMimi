[project]
name = "openmimi"
version = "0.0.1"
description = "Local Windows AI Agent that operates browsers and desktop apps via vision-based tool use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenMimi Contributors" }]
keywords = ["agent", "browser-use", "computer-use", "windows", "anthropic", "tool-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.40.0",
    "browser-use>=0.12.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pillow>=10.3.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
openmimi = "openmimi.cli:app"

[project.urls]
Homepage = "https://github.com/ToccataFermion/OpenMimi"
Repository = "https://github.com/ToccataFermion/OpenMimi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmimi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
